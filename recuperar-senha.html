<!doctype html>
<html lang="pt-BR">
  <head>
    <link rel="stylesheet" href="./vendor/fontawesome/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link
      rel="icon"
      href="./assets/imgs/jadi/img/logolove.png"
      type="image/png"
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Love Journey | Recuperar senha</title>

    <link rel="stylesheet" href="./css/base.css" />
    <link rel="stylesheet" href="./css/autenticacao/autenticacao.css" />
    <link rel="stylesheet" href="./css/autenticacao/esqueci-senha.css" />
    <script src="./app/app-android.js"></script>
  </head>

  <body class="corpo-esqueci">
    <main class="tela-esqueci">
      <!-- LADO ESQUERDO — FORMULÁRIO -->
      <section class="painel-esqueci">
        <div class="conteudo-esqueci">
          <h1 class="logo logo-esqueci">Love Journey</h1>

          <h2 class="titulo-esqueci">Esqueceu sua senha?</h2>

          <p class="subtitulo-esqueci">
            Não se preocupe! Crie uma nova senha para continuar sua jornada.
          </p>

          <form id="form-esqueci" novalidate>
            <div class="campo-esqueci">
              <label for="senha"> Nova senha </label>

              <div class="campo-senha-esqueci">
                <input
                  type="password"
                  id="senha"
                  name="senha"
                  placeholder="Digite sua nova senha"
                  minlength="8"
                  required
                />

                <button
                  type="button"
                  class="botao-olho-esqueci"
                  id="mostrar-senha"
                  aria-label="Mostrar senha"
                >
                  <i aria-hidden="true" class="fa-solid fa-eye"></i>
                </button>
              </div>

              <span class="dica-senha">
                Sua senha deve ter pelo menos 8 caracteres.
              </span>

              <span class="mensagem-erro-esqueci" id="erro-senha"></span>
            </div>

            <div class="campo-esqueci">
              <label for="confirmar-senha"> Confirmar nova senha </label>

              <div class="campo-senha-esqueci">
                <input
                  type="password"
                  id="confirmar-senha"
                  name="confirmar-senha"
                  placeholder="Digite novamente sua senha"
                  minlength="8"
                  required
                />

                <button
                  type="button"
                  class="botao-olho-esqueci"
                  data-alvo="confirmar-senha"
                  aria-label="Mostrar senha"
                >
                  <i aria-hidden="true" class="fa-solid fa-eye"></i>
                </button>
              </div>

              <span class="mensagem-erro-esqueci" id="erro-confirmar"></span>
            </div>

            <button type="submit" class="btn btn-rosa btn-redefinir">
              Redefinir senha
            </button>

            <p class="texto-voltar-login">
              Lembrou sua senha?
              <a href="login.html"> Voltar para o login </a>
            </p>
          </form>
        </div>
      </section>

      <!-- LADO DIREITO — TEMPLATE -->
      <section class="painel-visual-esqueci">
        <div class="logo-marca-esqueci">
          <img
            src="./assets/imgs/logo-icone.png"
            alt="Love Journey"
            class="imagem-esqueci"
          />
        </div>
      </section>
    </main>

    <script src="./js/autenticacao/esqueci-senha.js"></script>
  </body>
</html>
